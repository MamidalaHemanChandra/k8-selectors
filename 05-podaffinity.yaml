apiVersion: v1
kind: Pod
metadata:
  name: pod-affinity-1
  labels:
    app: pod-affinity-1
spec:
  containers:
  - name: nginx
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-affinity-2
  labels:
    app: pod-affinity-2
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: pod-affinity-1
        topologyKey: topology.kubernetes.io/zone
  containers:
  - name: nginx
    image: nginx